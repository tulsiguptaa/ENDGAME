<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Interviewer · Logo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100vh;
    background: #05070d;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }

  /* ------------------------------------------------------------------
     LOGO LOCKUP
  ------------------------------------------------------------------ */
  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.4rem;
    padding: 2rem;
    user-select: none;
  }

  /* ==================================================================
     SYMBOL — Electric Blue Waveform
  ================================================================== */
  .mark {
    width: 340px;
    height: 140px;
    position: relative;
    flex-shrink: 0;
  }

  .mark svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  /* ── Glow filter applied to the waveform ── */
  .glow-layer {
    filter: url(#waveGlow);
    animation: glowPulse 3s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1;    }
  }

  /* ── Individual wave bars — subtle shimmer ── */
  .wb {
    transform-origin: center;
    animation: shimmer 2.4s ease-in-out infinite;
  }
  .wb-1  { animation-delay: 0.00s; }
  .wb-2  { animation-delay: 0.05s; }
  .wb-3  { animation-delay: 0.10s; }
  .wb-4  { animation-delay: 0.15s; }
  .wb-5  { animation-delay: 0.20s; }
  .wb-6  { animation-delay: 0.25s; }
  .wb-7  { animation-delay: 0.30s; }
  .wb-8  { animation-delay: 0.35s; }
  .wb-9  { animation-delay: 0.40s; }
  .wb-10 { animation-delay: 0.45s; }
  .wb-11 { animation-delay: 0.50s; }
  .wb-12 { animation-delay: 0.55s; }
  .wb-13 { animation-delay: 0.60s; }
  .wb-14 { animation-delay: 0.65s; }
  .wb-15 { animation-delay: 0.70s; }
  .wb-16 { animation-delay: 0.75s; }
  .wb-17 { animation-delay: 0.80s; }
  .wb-18 { animation-delay: 0.85s; }
  .wb-19 { animation-delay: 0.90s; }
  .wb-20 { animation-delay: 0.95s; }
  .wb-21 { animation-delay: 1.00s; }
  .wb-22 { animation-delay: 1.05s; }
  .wb-23 { animation-delay: 1.10s; }
  .wb-24 { animation-delay: 1.15s; }
  .wb-25 { animation-delay: 1.20s; }
  .wb-26 { animation-delay: 1.25s; }
  .wb-27 { animation-delay: 1.30s; }
  .wb-28 { animation-delay: 1.35s; }
  .wb-29 { animation-delay: 1.40s; }
  .wb-30 { animation-delay: 1.45s; }
  .wb-31 { animation-delay: 1.50s; }
  .wb-32 { animation-delay: 1.55s; }
  .wb-33 { animation-delay: 1.60s; }
  .wb-34 { animation-delay: 1.65s; }
  .wb-35 { animation-delay: 1.70s; }
  .wb-36 { animation-delay: 1.75s; }
  .wb-37 { animation-delay: 1.80s; }
  .wb-38 { animation-delay: 1.85s; }
  .wb-39 { animation-delay: 1.90s; }
  .wb-40 { animation-delay: 1.95s; }

  @keyframes shimmer {
    0%, 100% { opacity: 0.75; }
    50%      { opacity: 1;    }
  }

  /* ── Center axis line — the "sound beam" ── */
  .axis {
    animation: axisPulse 2.8s ease-in-out infinite;
  }
  @keyframes axisPulse {
    0%, 100% { opacity: 0.6; }
    50%      { opacity: 1;   }
  }

  /* ==================================================================
     WORDMARK
  ================================================================== */
  .wordmark {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
  }

  .wordmark .brand {
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.03em;
    color: #ffffff;
    display: flex;
    align-items: baseline;
  }

  .wordmark .brand .ai {
    font-weight: 800;
    background: linear-gradient(140deg, #4fc3ff 0%, #1e88e5 55%, #0d47a1 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-right: 0.3rem;
    text-shadow: 0 0 24px rgba(79, 195, 255, 0.5);
  }

  .wordmark .tagline {
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: #5f7fa8;
    margin-top: 0.7rem;
  }

  /* ------------------------------------------------------------------
     RESPONSIVE
  ------------------------------------------------------------------ */
  @media (max-width: 520px) {
    .mark { width: 260px; height: 110px; }
    .wordmark .brand { font-size: 1.65rem; }
    .wordmark .tagline { font-size: 0.6rem; letter-spacing: 0.4em; }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow-layer, .wb, .axis { animation: none; }
  }
</style>
</head>
<body>

  <div class="logo" role="img" aria-label="AI Interviewer logo">

    <!-- ==============================================================
         SYMBOL — Electric Blue Waveform
         A soundwave silhouette, mirrored across a bright center axis,
         with outer glow — inspired by electric audio visualizers.
    ============================================================== -->
    <div class="mark">
      <svg viewBox="0 0 340 140" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">

        <!-- ── Soft background glow ── -->
        <ellipse cx="170" cy="70" rx="160" ry="42"
                 fill="url(#bgGlow)" opacity="0.55"/>

        <!-- ── Waveform layer (with glow filter) ── -->
        <g class="glow-layer">

          <!-- Center bright axis -->
          <line class="axis" x1="8" y1="70" x2="332" y2="70"
                stroke="url(#axisGrad)" stroke-width="1.6" stroke-linecap="round"/>

          <!-- Symmetric wave bars (mirrored top/bottom) -->
          <!-- Each rect is drawn as a vertical bar centered on y=70 -->

          <!-- 1 -->
          <rect class="wb wb-1"  x="10"  y="58" width="2.2" height="24" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 2 -->
          <rect class="wb wb-2"  x="17"  y="52" width="2.2" height="36" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 3 -->
          <rect class="wb wb-3"  x="24"  y="44" width="2.2" height="52" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 4 -->
          <rect class="wb wb-4"  x="31"  y="34" width="2.2" height="72" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 5 -->
          <rect class="wb wb-5"  x="38"  y="48" width="2.2" height="44" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 6 -->
          <rect class="wb wb-6"  x="45"  y="30" width="2.2" height="80" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 7 -->
          <rect class="wb wb-7"  x="52"  y="40" width="2.2" height="60" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 8 -->
          <rect class="wb wb-8"  x="59"  y="20" width="2.2" height="100" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 9 -->
          <rect class="wb wb-9"  x="66"  y="46" width="2.2" height="48" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 10 -->
          <rect class="wb wb-10" x="73"  y="28" width="2.2" height="84" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 11 -->
          <rect class="wb wb-11" x="80"  y="42" width="2.2" height="56" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 12 -->
          <rect class="wb wb-12" x="87"  y="14" width="2.2" height="112" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 13 -->
          <rect class="wb wb-13" x="94"  y="38" width="2.2" height="64" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 14 -->
          <rect class="wb wb-14" x="101" y="22" width="2.2" height="96" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 15 -->
          <rect class="wb wb-15" x="108" y="44" width="2.2" height="52" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 16 -->
          <rect class="wb wb-16" x="115" y="10" width="2.2" height="120" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 17 -->
          <rect class="wb wb-17" x="122" y="34" width="2.2" height="72" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 18 -->
          <rect class="wb wb-18" x="129" y="18" width="2.2" height="104" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 19 -->
          <rect class="wb wb-19" x="136" y="48" width="2.2" height="44" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 20 -->
          <rect class="wb wb-20" x="143" y="26" width="2.2" height="88" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 21 -->
          <rect class="wb wb-21" x="150" y="40" width="2.2" height="60" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 22 -->
          <rect class="wb wb-22" x="157" y="6"  width="2.2" height="128" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 23 -->
          <rect class="wb wb-23" x="164" y="30" width="2.2" height="80" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 24 (mirror of 22) -->
          <rect class="wb wb-24" x="171" y="6"  width="2.2" height="128" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 25 -->
          <rect class="wb wb-25" x="178" y="40" width="2.2" height="60" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 26 -->
          <rect class="wb wb-26" x="185" y="26" width="2.2" height="88" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 27 -->
          <rect class="wb wb-27" x="192" y="48" width="2.2" height="44" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 28 -->
          <rect class="wb wb-28" x="199" y="18" width="2.2" height="104" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 29 -->
          <rect class="wb wb-29" x="206" y="34" width="2.2" height="72" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 30 -->
          <rect class="wb wb-30" x="213" y="10" width="2.2" height="120" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 31 -->
          <rect class="wb wb-31" x="220" y="44" width="2.2" height="52" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 32 -->
          <rect class="wb wb-32" x="227" y="22" width="2.2" height="96" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 33 -->
          <rect class="wb wb-33" x="234" y="38" width="2.2" height="64" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 34 -->
          <rect class="wb wb-34" x="241" y="14" width="2.2" height="112" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 35 -->
          <rect class="wb wb-35" x="248" y="42" width="2.2" height="56" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 36 -->
          <rect class="wb wb-36" x="255" y="28" width="2.2" height="84" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 37 -->
          <rect class="wb wb-37" x="262" y="46" width="2.2" height="48" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 38 -->
          <rect class="wb wb-38" x="269" y="20" width="2.2" height="100" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 39 -->
          <rect class="wb wb-39" x="276" y="40" width="2.2" height="60" rx="1.1" fill="url(#waveGrad)"/>
          <!-- 40 -->
          <rect class="wb wb-40" x="283" y="30" width="2.2" height="80" rx="1.1" fill="url(#waveGrad)"/>

          <!-- Additional smaller trailing bars to fade out -->
          <rect class="wb wb-1" x="290" y="48" width="2.2" height="44" rx="1.1" fill="url(#waveGrad)" opacity="0.7"/>
          <rect class="wb wb-2" x="297" y="34" width="2.2" height="72" rx="1.1" fill="url(#waveGrad)" opacity="0.55"/>
          <rect class="wb wb-3" x="304" y="52" width="2.2" height="36" rx="1.1" fill="url(#waveGrad)" opacity="0.4"/>
          <rect class="wb wb-4" x="311" y="58" width="2.2" height="24" rx="1.1" fill="url(#waveGrad)" opacity="0.3"/>
          <rect class="wb wb-5" x="318" y="62" width="2.2" height="16" rx="1.1" fill="url(#waveGrad)" opacity="0.2"/>
          <rect class="wb wb-6" x="325" y="66" width="2.2" height="8"  rx="1.1" fill="url(#waveGrad)" opacity="0.12"/>

        </g>

        <!-- ── Bright inner core lines (crisper overlay for that "electric" look) ── -->
        <g opacity="0.9" style="mix-blend-mode: screen;">
          <rect x="157" y="6"  width="1" height="128" rx="0.5" fill="#ffffff" opacity="0.9"/>
          <rect x="171" y="6"  width="1" height="128" rx="0.5" fill="#ffffff" opacity="0.9"/>
          <rect x="115" y="10" width="1" height="120" rx="0.5" fill="#e0f5ff" opacity="0.7"/>
          <rect x="213" y="10" width="1" height="120" rx="0.5" fill="#e0f5ff" opacity="0.7"/>
          <rect x="87"  y="14" width="1" height="112" rx="0.5" fill="#d0f0ff" opacity="0.6"/>
          <rect x="241" y="14" width="1" height="112" rx="0.5" fill="#d0f0ff" opacity="0.6"/>
        </g>

        <!-- ── GRADIENTS & FILTERS ── -->
        <defs>
          <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#1e88e5" stop-opacity="0.55"/>
            <stop offset="55%"  stop-color="#0d47a1" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#05070d" stop-opacity="0"/>
          </radialGradient>

          <linearGradient id="axisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#4fc3ff" stop-opacity="0"/>
            <stop offset="15%"  stop-color="#4fc3ff" stop-opacity="0.9"/>
            <stop offset="50%"  stop-color="#ffffff" stop-opacity="1"/>
            <stop offset="85%"  stop-color="#4fc3ff" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#4fc3ff" stop-opacity="0"/>
          </linearGradient>

          <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#e0f7ff" stop-opacity="1"/>
            <stop offset="30%"  stop-color="#4fc3ff" stop-opacity="1"/>
            <stop offset="70%"  stop-color="#1e88e5" stop-opacity="1"/>
            <stop offset="100%" stop-color="#0d47a1" stop-opacity="1"/>
          </linearGradient>

          <filter id="waveGlow" x="-30%" y="-60%" width="160%" height="220%">
            <feGaussianBlur stdDeviation="3.5" result="blur1"/>
            <feGaussianBlur stdDeviation="7"   result="blur2"/>
            <feMerge>
              <feMergeNode in="blur2"/>
              <feMergeNode in="blur1"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

      </svg>
    </div>

    <!-- ==============================================================
         WORDMARK
    ============================================================== -->
    <div class="wordmark">
      <div class="brand">
        <span class="ai">AI</span>
        <span>Interviewer</span>
      </div>
      <div class="tagline">Hear · Understand · Decide</div>
    </div>

  </div>

</body>
</html>
